version: '3.8'

services:

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: automation_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django API ───────────────────────────────────────────
  api:
    build: .
    container_name: automation_api
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app                  # live reload during development

  # ── Celery Worker ────────────────────────────────────────
  celery-worker:
    build: .
    container_name: automation_worker
    command: celery -A automation worker --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app

  # ── Celery Beat (Scheduler) ──────────────────────────────
  celery-beat:
    build: .
    container_name: automation_beat
    command: celery -A automation beat --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app